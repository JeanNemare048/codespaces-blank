<!doctype html> 
<html lang="en"> 
<head> 
   <meta charset="UTF-8" />
   <title>Phaser Game with Firetruck Aiming Bar</title>
   <script src="//cdn.jsdelivr.net/npm/phaser@3.11.0/dist/phaser.js"></script>
   <style type="text/css">
      body {
         margin: 0;
         background-color: #222;
         overflow: hidden;
         position: relative;
      }
      canvas {
         cursor: none; /* Hide the default cursor */
      }
      #modeDisplay {
         display: none;
         position: absolute;
         top: 10px;
         left: 10px;
         color: white;
         font-family: Arial, sans-serif;
         font-size: 16px;
         background-color: rgba(0, 0, 0, 0.7);
         padding: 10px;
         border-radius: 5px;
         z-index: 1000;
      }
      #aimingBar {
         display: none;
         position: absolute;
         left: 50px;
         bottom: 100px;
         width: 100px;
         height: 20px;
         background-color: #FF5722;
         border-radius: 10px;
         transform-origin: 0% 50%; /* Rotate from left side */
         transition: transform 0.1s ease-out;
         z-index: 900;
         pointer-events: none; /* Allow clicks to pass through to canvas */
      }
      #angleDisplay {
         position: absolute;
         top: 50px;
         right: 10px;
         color: white;
         font-family: Arial, sans-serif;
         font-size: 16px;
         background-color: rgba(0, 0, 0, 0.7);
         padding: 10px;
         border-radius: 5px;
         z-index: 1000;
      }
   </style>
</head>
<body>
   <div id="modeDisplay">Mode: Mouse Follow (Press M to toggle)</div>
   <div id="aimingBar"></div>
   <!-- <div id="angleDisplay">Angle: 0°</div> -->
    <script type="module" src="main.js"></script>
</body>
</html>
